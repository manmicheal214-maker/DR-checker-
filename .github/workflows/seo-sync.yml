name: Sync SEO tool surfaces

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Worker syntax on pull requests
        if: github.event_name == 'pull_request'
        run: node --check worker.js && node --check tools/site-audit-domain.js && node --check tools/site-audit.js
      - name: Check generated surfaces on pull requests
        if: github.event_name == 'pull_request'
        run: node scripts/sync-tools.js --check
      - name: Check Worker syntax
        run: node --check worker.js && node --check tools/site-audit-domain.js
      - name: Regenerate tool surfaces on main
        if: github.event_name == 'push'
        run: node scripts/sync-tools.js
      - name: Commit regenerated files
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "Tool surfaces already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools sitemap.xml
          git commit -m "Part B: regenerate SEO tool surfaces"
          git pull --rebase origin main
          git push
      - name: Verify synchronization on main
        if: github.event_name == 'push'
        run: node scripts/sync-tools.js --check
