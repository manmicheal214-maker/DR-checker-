name: Sync SEO tool surfaces

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate tool surfaces
        run: node scripts/sync-tools.js
      - name: Commit regenerated files
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "Tool surfaces already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools sitemap.xml
          git commit -m "chore: sync SEO tool surfaces"
          git push
      - name: Verify synchronization
        run: node scripts/sync-tools.js --check
